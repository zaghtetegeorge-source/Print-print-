<script>
/* ---------- analytics ----------
   CLARITY_ID: من clarity.microsoft.com → Settings → Overview → Project ID
   أي جهاز بيفتح #admin بيتسجّل "مستثنى" وما بيتحسب بالإحصائيات (زياراتك انت) */
const CLARITY_ID='';
(function(){
  let off=false;try{if(location.hash==='#admin')localStorage.setItem('ig_notrack','1');off=localStorage.getItem('ig_notrack')==='1';}catch(_){}
  window.IG_NOTRACK=off; if(off)return;
  window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};
  const v=document.createElement('script');v.defer=true;v.src='/_vercel/insights/script.js';document.head.appendChild(v);
  if(CLARITY_ID){(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window,document,"clarity","script",CLARITY_ID);}
})();
function track(name,data){
  if(window.IG_NOTRACK)return;
  try{if(window.clarity){clarity('event',name);if(data)for(const k in data)clarity('set',k,String(data[k]));}}catch(_){}
  try{window.va&&va('event',{name,data});}catch(_){}
}
</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Infinity Graphic · طباعة فاخرة في الإمارات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: brand-gradient world from the Infinity logo (violet → indigo → sky). Hash-routed pages: home, how-it-works, one page per product, order. */
:root{
  --violet:#5634A4; --indigo:#4F5CC2; --sky:#1F8BC9;
  --grad:linear-gradient(120deg,#5634A4 0%,#4F5CC2 45%,#1F8BC9 100%);
  --bg:#FFFFFF; --soft:#F3F2FB; --card:#FFFFFF; --ink:#16143A; --muted:#625F82; --line:#E3E1F1;
  --wa:#25D366; --err:#D93A5B;
  --head:"Alexandria","Tajawal",Tahoma,sans-serif;
  --body:"Tajawal","Alexandria",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0B20; --soft:#14123A; --card:#18163F; --ink:#EEEDFA; --muted:#A6A3C9; --line:#2B2858; --err:#FF7A93; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0B20; --soft:#14123A; --card:#18163F; --ink:#EEEDFA; --muted:#A6A3C9; --line:#2B2858; --err:#FF7A93; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;margin-inline:auto}
h1,h2,h3{font-family:var(--head);line-height:1.3;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.view{animation:enter .55s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{transform:translateY(18px)}to{transform:none}}

/* ---------- Nav ---------- */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:42px;height:42px;border-radius:50%;display:block}
.brand b{font-family:var(--head);font-size:1rem;display:block;line-height:1.2}
.brand small{font-size:.62rem;letter-spacing:.3em;color:var(--muted);direction:ltr;display:block;text-align:right}
.links{display:flex;gap:4px}
.links a{text-decoration:none;font-family:var(--head);font-weight:500;font-size:.92rem;padding:8px 14px;border-radius:999px;color:var(--muted);white-space:nowrap}
.links a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.nav-cta{position:relative;background:var(--grad);color:#fff;text-decoration:none;font-family:var(--head);font-weight:600;font-size:.9rem;padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(79,92,194,.35);white-space:nowrap}
.nav-cta .cnt{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;border-radius:999px;background:var(--wa);color:#063A1C;font-size:.75rem;display:grid;place-items:center;padding-inline:5px;border:2px solid var(--bg)}
.tabbar{display:none}
@media (max-width:760px){
  nav .links{display:none}
  .tabbar{display:flex;position:fixed;z-index:14;bottom:0;left:0;right:0;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(40,30,110,.08);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .tabbar a{font-size:.85rem;padding:8px 12px}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .nav-cta{padding:9px 14px;font-size:.85rem}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:14px;font-family:var(--head);font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;border:0;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.dark{background:#110F2E;color:#fff;box-shadow:0 10px 26px rgba(10,8,40,.35)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.btn.grad{background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(79,92,194,.35)}
.btn.out{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa);color:#08361B}
.btn.sm{padding:9px 14px;font-size:.85rem;border-radius:10px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;isolation:isolate;background:linear-gradient(120deg,#5634A4,#4F5CC2,#1F8BC9,#5634A4);background-size:300% 300%;animation:flow 14s ease infinite}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1}
.b1{width:380px;height:380px;background:#8A5BE0;top:-120px;right:-80px;animation:bob 9s ease-in-out infinite}
.b2{width:320px;height:320px;background:#29B2E8;bottom:-140px;left:-60px;animation:bob 11s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translate(30px,40px) scale(1.1)}}
svg.loop{position:absolute;left:50%;top:50%;width:min(1100px,140vw);transform:translate(-50%,-50%);z-index:-1;opacity:.16}
svg.loop path{fill:none;stroke:#fff;stroke-width:26;stroke-linejoin:round;stroke-dasharray:1400;animation:trace 9s linear infinite}
@keyframes trace{to{stroke-dashoffset:-2800}}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding-block:clamp(40px,7vw,88px) clamp(52px,8vw,100px)}
@media (max-width:860px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:999px;font-size:.88rem}
.pill i{width:8px;height:8px;border-radius:50%;background:#7CF2B1;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(124,242,177,.7)}70%,100%{box-shadow:0 0 0 10px rgba(124,242,177,0)}}
.hero h1{font-size:clamp(2.1rem,6vw,3.7rem);font-weight:800;margin-block:18px 14px}
.rot{display:inline-grid;vertical-align:bottom;height:1.3em;overflow:hidden}
.rot span{grid-area:1/1;color:#BFE6FF;animation:swap 9s infinite;opacity:0;transform:translateY(100%)}
.rot span:nth-child(2){animation-delay:3s}.rot span:nth-child(3){animation-delay:6s}
@keyframes swap{0%{opacity:0;transform:translateY(100%)}5%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-100%)}}
.hero p.lead{font-size:1.1rem;opacity:.92;max-width:48ch;margin:0}
.ctas{display:flex;flex-direction:column;gap:12px;margin-top:28px;max-width:420px}
.stack{position:relative;height:clamp(300px,42vw,440px)}
.stack figure{position:absolute;margin:0;width:62%;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(10,8,40,.45);border:3px solid rgba(255,255,255,.85);background:#111}
.stack img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.s1{top:4%;right:0;transform:rotate(-6deg);animation:float1 7s ease-in-out infinite}
.s2{top:30%;left:0;transform:rotate(5deg);animation:float2 8s ease-in-out infinite;z-index:2}
.s3{bottom:0;right:14%;width:48%!important;transform:rotate(-2deg);animation:float1 9s ease-in-out infinite reverse;z-index:3}
@keyframes float1{50%{transform:rotate(-3deg) translateY(-14px)}}
@keyframes float2{50%{transform:rotate(7deg) translateY(12px)}}
.tag{position:absolute;z-index:4;background:#fff;color:#16143A;font-family:var(--head);font-weight:600;font-size:.85rem;padding:8px 14px;border-radius:999px;box-shadow:0 10px 24px rgba(10,8,40,.25);white-space:nowrap}
.tag b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.t1{top:0;left:8%;animation:float2 6s ease-in-out infinite}
.t2{bottom:12%;left:2%;animation:float1 7s ease-in-out infinite}

/* page hero (inner pages) */
.phero{position:relative;overflow:hidden;color:#fff;isolation:isolate;background:linear-gradient(120deg,#5634A4,#4F5CC2,#1F8BC9,#5634A4);background-size:300% 300%;animation:flow 14s ease infinite;padding-block:clamp(36px,6vw,64px);text-align:center}
.phero h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:800;margin-block:10px}
.phero p{margin:0 auto;opacity:.9;max-width:52ch}
.crumbs{font-size:.85rem;opacity:.85}
.crumbs a{color:#fff}

/* ---------- Marquee ---------- */
.marquee{overflow:hidden;background:var(--soft);border-block:1px solid var(--line);padding-block:14px}
.track{display:flex;gap:40px;width:max-content;animation:scroll 32s linear infinite}
.track span{font-family:var(--head);font-weight:600;font-size:1.05rem;white-space:nowrap;display:flex;align-items:center;gap:40px;color:var(--muted)}
.track span::after{content:"∞";background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.3rem}
@keyframes scroll{to{transform:translateX(50%)}}

/* ---------- Sections ---------- */
section.sec{padding-block:clamp(52px,8vw,96px)}
#products{scroll-margin-top:60px}
.sh{text-align:center;max-width:640px;margin:0 auto 36px}
.eyebrow{font-family:var(--head);font-weight:600;font-size:.86rem;letter-spacing:.04em}
.sh h2{font-size:clamp(1.8rem,4.6vw,2.6rem);font-weight:800;margin-block:6px 10px}
.sh p{color:var(--muted);margin:0}
.reveal{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.js .reveal:not(.in){transform:translateY(34px)}

/* ---------- Product cards ---------- */
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);padding:9px 20px;border-radius:999px;font-family:var(--head);font-weight:600;font-size:.92rem;cursor:pointer;transition:.2s}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(79,92,194,.3)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media (max-width:340px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.prod h3{font-size:.95rem}.pb{padding:10px 12px 12px}.price b{font-size:1.25rem}.more{display:none}}
[hidden]{display:none!important}
.prod{background:var(--card);border-radius:22px;border:1.5px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s;text-decoration:none;color:inherit}
.prod:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(40,30,110,.16)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;max-width:100%;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.prod:hover .ph img{transform:scale(1.08)}
.badge{position:absolute;top:10px;right:10px;background:var(--grad);color:#fff;font-family:var(--head);font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px}
.pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.prod h3{font-size:1.05rem;font-weight:700}
.specs{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.74rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;flex-wrap:wrap}
.price b{font-family:var(--head);font-size:1.5rem;font-weight:800}
.price span{font-size:.78rem;color:var(--muted);margin-inline-start:3px}
.more{font-family:var(--head);font-size:.8rem;font-weight:600;color:var(--indigo)}

/* ---------- Product page ---------- */
.pp{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,48px);align-items:start;padding-block:clamp(24px,5vw,56px)}
@media (max-width:860px){.pp{grid-template-columns:minmax(0,1fr)}}
.gal{position:sticky;top:90px;min-width:0}
@media (max-width:860px){.gal{position:static}}
.gal .main{border-radius:26px;overflow:hidden;aspect-ratio:3/2;max-width:100%;box-shadow:0 30px 60px rgba(40,30,110,.18);position:relative}
.gal .main img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1) translate(-2%,-2%)}}
.gal .main .badge{top:14px;right:14px;font-size:.8rem;padding:5px 12px}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.perks div{background:var(--soft);border-radius:16px;padding:12px;text-align:center;font-size:.82rem;color:var(--muted)}
.perks b{display:block;font-family:var(--head);color:var(--ink);font-size:.95rem}
.info{min-width:0}
.info h1{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;margin-block:6px 10px}
.info .desc{color:var(--muted);margin:0 0 18px}
.bigprice{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:16px 18px;border-radius:18px;background:var(--soft);margin-bottom:18px}
.bigprice b{font-family:var(--head);font-weight:800;font-size:2.4rem;line-height:1}
.bigprice span{color:var(--muted)}
.bigprice em{font-style:normal;margin-inline-start:auto;font-size:.85rem;color:var(--indigo);font-weight:700}
.spec-table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:.95rem}
.spec-table td{padding:10px 4px;border-bottom:1px solid var(--line)}
.spec-table td:first-child{color:var(--muted);width:40%}
.spec-table td:last-child{font-weight:700}
.feat{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.75rem;margin-top:3px}
.choose{display:grid;gap:12px;padding:18px;border-radius:20px;border:1.5px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row label{font-weight:700;font-family:var(--head);font-size:.95rem}
.stepper{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);cursor:pointer;font-weight:800;font-size:1.1rem;box-shadow:0 2px 6px rgba(40,30,110,.1)}
.stepper output{min-width:6ch;text-align:center;font-weight:800;font-family:var(--head)}
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 8px rgba(40,30,110,.12)}
.sum-line{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px}
.sum-line b{font-family:var(--head);font-size:1.5rem;font-weight:800}
.order-now{width:100%;font-size:1.1rem;padding:17px}
.order-now .arrow{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-6px)}}
.related{padding-block:20px clamp(48px,7vw,80px)}

/* ---------- How page ---------- */
.steps-sec{background:var(--grad);color:#fff}
.timeline{max-width:640px;margin-inline:auto;display:grid}
.node{display:grid;justify-items:center}
.line{width:0;height:46px;border-inline-start:2px dashed rgba(255,255,255,.75)}
.circle{width:64px;height:64px;border-radius:50%;background:#fff;color:#16143A;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.3rem;box-shadow:0 0 0 8px rgba(255,255,255,.15)}
.scard{width:100%;background:rgba(14,12,46,.38);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:22px;padding:22px;text-align:center}
.scard h3{font-size:1.5rem;font-weight:800;margin-top:18px}
.scard p{margin:6px 0 0;opacity:.9}
.scard ul{text-align:start;margin:12px 0 0;padding-inline-start:20px;opacity:.9;font-size:.95rem}
.mock{position:relative;background:#fff;border-radius:16px;height:150px;margin-inline:auto;max-width:360px;color:#16143A}
.mock img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
.act{position:absolute;bottom:-14px;left:-6px;background:#fff;color:#16143A;border-radius:999px;padding:8px 18px;font-family:var(--head);font-weight:600;font-size:.9rem;box-shadow:0 10px 24px rgba(10,8,40,.3)}
.act::before{content:"";position:absolute;top:-16px;right:-6px;border:8px solid transparent;border-bottom:14px solid #1F8BC9;border-top:0;animation:tapc 2.4s ease-in-out infinite}
@keyframes tapc{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(-35deg) translate(-8px,6px)}}
.mock.up{display:grid;place-items:center;border:2px dashed #C9C6E4;background:#F6F5FD}
.mock.up .barx{width:70%;height:10px;border-radius:99px;background:#E6E4F5;overflow:hidden}
.mock.up .barx i{display:block;height:100%;background:var(--grad);animation:load 2.6s ease-in-out infinite}
@keyframes load{0%{width:5%}80%,100%{width:100%}}
.fl{font-family:var(--head);font-weight:600;font-size:.9rem;direction:ltr}
.mock.check{display:grid;place-items:center;background:#F6F5FD}
.seal{width:76px;height:76px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:2rem;animation:pop 2.6s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.12)}}
.mock.van{display:flex;align-items:center;overflow:hidden;background:linear-gradient(#F6F5FD 70%,#E6E4F5 70%)}
.mock.van .v{font-size:3.4rem;animation:drive 4s linear infinite}
@keyframes drive{0%{transform:translateX(120%)}100%{transform:translateX(-420%)}}
.mock.pay{display:flex;align-items:center;justify-content:center;gap:10px;background:#F6F5FD;flex-wrap:wrap;padding:10px}

/* ---------- Order page ---------- */
.formwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.formwrap>*,.box,.cart,.ci>div{min-width:0}
.ci h4{overflow-wrap:anywhere}
@media (max-width:420px){.ci{grid-template-columns:56px minmax(0,1fr)}.ci img{width:56px;height:44px}.ci .r{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
.bar .err{font-size:.82rem}
@media (max-width:520px){.bar .tot{font-size:1.3rem}.bar .btn{padding:12px 18px}}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:clamp(18px,3.5vw,30px)}
.bt{display:flex;align-items:center;gap:12px;margin-bottom:18px}

.bt h3{font-size:1.3rem;font-weight:700}
.cart{display:grid;gap:10px}
.ci{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--soft)}
.ci img{width:72px;height:54px;object-fit:cover;border-radius:10px;display:block}
.ci h4{margin:0;font-family:var(--head);font-size:.95rem}
.ci small{color:var(--muted)}
.ci .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ci .stepper{padding:2px}
.ci .stepper button{width:28px;height:28px;font-size:.95rem}
.ci .stepper output{min-width:4.6ch;font-size:.85rem}
.rm{border:0;background:none;color:var(--err);font-size:.8rem;cursor:pointer;padding:0}
.empty{text-align:center;padding:18px;color:var(--muted)}
.addmore{display:flex;gap:8px;overflow-x:auto;max-width:100%;min-width:0;padding-block:4px 8px;margin-top:12px;scroll-snap-type:x mandatory}
.addmore button{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line);background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.addmore img{width:38px;height:30px;object-fit:cover;border-radius:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.92rem;min-width:0}
label.f small{color:var(--muted);font-weight:400}
input[type=text],input[type=tel],select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);background:var(--card);box-shadow:0 0 0 4px rgba(79,92,194,.15)}
textarea{min-height:110px;resize:vertical}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;border:1.5px solid var(--line);cursor:pointer;background:var(--soft);transition:.2s}
.opt:has(input:checked){border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box}
.opt input{margin-top:6px;accent-color:var(--indigo)}
.opt b{display:block;font-family:var(--head);font-weight:600}
.opt span{color:var(--muted);font-size:.85rem}
.drop{position:relative;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;background:var(--soft)}
.drop:hover{border-color:var(--indigo)}
.drop .ic{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:1.3rem}
.drop small{display:block;color:var(--muted);font-size:.8rem}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.files{list-style:none;padding:0;margin:8px 0 0;font-size:.85rem;direction:ltr;word-break:break-all;color:var(--indigo)}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.9rem;color:var(--muted)}
.note b{color:var(--ink)}
.bar{position:sticky;bottom:0;z-index:12;margin-top:22px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border:1.5px solid var(--line);border-radius:20px 20px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(40,30,110,.12)}
@media (max-width:760px){
  body.on-order .tabbar{display:none}
  body.on-order{padding-bottom:0}
  .bar{bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0}
  .bar .in{flex-wrap:nowrap}
  .bar .tot{font-size:1.25rem}
  .bar .sub{font-size:.76rem}
  .bar .btn{padding:11px 16px;font-size:.9rem;white-space:nowrap}
}
/* while typing: total bar steps out of the way so the keyboard never hides the field */
body.typing .bar{position:static;box-shadow:none}
body.typing .tabbar,body.typing .fab,body.typing .fab-call{display:none}
.bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .tot{font-family:var(--head);font-weight:800;font-size:1.6rem;line-height:1.2}
.bar .sub{color:var(--muted);font-size:.84rem}
.err{color:var(--err);font-weight:700;font-size:.9rem;margin:6px 0 0}
.done{text-align:center;max-width:680px;margin-inline:auto}
.inv-head{text-align:center;max-width:560px;margin:0 auto 14px}
.inv-head h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.inv-head p{color:var(--muted);margin:4px 0 0}
.inv-head .big{width:76px;height:76px;border-radius:50%;background:var(--grad);color:#fff;font-size:2rem;display:grid;place-items:center;margin:0 auto 12px;animation:pop 2.6s ease-in-out infinite}
#confirm .acts{max-width:680px;margin-inline:auto}
.inv{max-width:760px;margin-inline:auto;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,34px);display:grid;gap:18px;box-shadow:0 24px 50px rgba(40,30,110,.12);position:relative;overflow:hidden}
.inv::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--grad)}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.inv-meta{text-align:left}
.inv-meta h3{font-size:1.6rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.inv-meta div{color:var(--muted);font-size:.88rem;direction:ltr}
.inv-parties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.inv-parties{grid-template-columns:minmax(0,1fr)}}
.inv-parties>div{background:var(--soft);border-radius:16px;padding:14px;font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.inv-parties span,.inv-info span{display:block;font-size:.75rem;letter-spacing:.04em;color:var(--indigo);font-family:var(--head);font-weight:600}
.inv-parties b{display:block;color:var(--ink);font-family:var(--head);font-size:1rem}
@media (max-width:480px){.inv-t th:nth-child(3),.inv-t td:nth-child(3){display:none}}
.inv-t{width:100%;border-collapse:collapse;font-size:.9rem}
.inv-t th{background:var(--soft);font-family:var(--head);font-weight:600;font-size:.8rem;padding:10px;text-align:start}
.inv-t td{padding:10px;border-top:1px solid var(--line)}
.inv-t td:not(:first-child),.inv-t th:not(:first-child){text-align:left;white-space:nowrap}
.inv-sum{display:grid;gap:6px;margin-inline-start:auto;width:min(100%,320px)}
.inv-sum div{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.inv-sum .grand{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-family:var(--head);font-weight:800;font-size:1.2rem}
.inv-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:14px}
@media (max-width:600px){.inv-info{grid-template-columns:minmax(0,1fr)}}
.inv-info b{font-size:.92rem;overflow-wrap:anywhere}
.inv-next{background:linear-gradient(120deg,rgba(86,52,164,.1),rgba(31,139,201,.1));border-radius:14px;padding:12px 14px;font-size:.92rem}
.done .big{width:84px;height:84px;border-radius:50%;background:var(--grad);color:#fff;font-size:2.2rem;display:grid;place-items:center;margin:0 auto 14px;animation:pop 2.6s ease-in-out infinite}
.receipt{width:100%;border-collapse:collapse;margin:18px 0;text-align:start;font-size:.95rem}
.receipt td{padding:10px 4px;border-bottom:1px solid var(--line)}
.receipt td:last-child{text-align:left;white-space:nowrap}
.receipt tr.t td{border:0;font-family:var(--head);font-weight:800;font-size:1.25rem}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.acts .btn{flex:1 1 200px}
code{direction:ltr;display:inline-block;font-family:var(--head);font-weight:600;padding:2px 8px;border-radius:8px;background:var(--soft)}

/* help + footer */
.help{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.help{grid-template-columns:minmax(0,1fr)}}
.hc{background:var(--soft);border-radius:22px;padding:24px;text-align:center}
.hc .i{width:56px;height:56px;border-radius:18px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:1.5rem;margin:0 auto 12px}
.hc h3{font-size:1.15rem;font-weight:700}
.hc p{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.cta-band{border-radius:28px;background:var(--grad);color:#fff;padding:clamp(26px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta-band h2{font-size:clamp(1.4rem,3.6vw,2rem);font-weight:800}
.cta-band p{margin:4px 0 0;opacity:.9}
footer{background:#110F2E;color:#C9C7E6;padding-block:34px;text-align:center;font-size:.9rem}
footer .brand{justify-content:center;margin-bottom:10px;color:#fff}
footer .brand small{color:#9C99C4}
.fab{position:fixed;z-index:30;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:var(--wa);color:#063A1C;text-decoration:none;font-family:var(--head);font-weight:700;padding:12px 18px;border-radius:999px;animation:wa 2.5s infinite}
.fab svg{width:24px;height:24px}
@media (max-width:760px){.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));padding:12px}.fab span{display:none}}
body.on-order .fab,body.on-order .fab-call,body.on-admin .fab,body.on-admin .fab-call{display:none}
.fab-call{position:fixed;z-index:30;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));width:50px;height:50px;border-radius:50%;background:var(--grad);display:grid;place-items:center;text-decoration:none;font-size:1.3rem;box-shadow:0 10px 24px rgba(79,92,194,.4)}
@media (max-width:760px){.fab-call{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
@keyframes wa{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.toast{position:fixed;z-index:40;top:calc(76px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);opacity:0;visibility:hidden;background:#110F2E;color:#fff;padding:10px 18px;border-radius:999px;font-family:var(--head);font-size:.9rem;transition:transform .35s,opacity .35s,visibility .35s;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ---------- dashboard ---------- */
.demo-banner{background:var(--soft);border:1.5px dashed color-mix(in srgb,var(--indigo) 45%,transparent);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:.92rem;color:var(--muted)}

.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .35s cubic-bezier(.2,.7,.2,1)}

.sheet-h{display:flex;gap:12px;align-items:center}

.sheet-h p{margin:0;color:var(--muted);font-size:.9rem}

.pdf-st{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.4em;margin:0 0 10px}

.pi-parties b{display:block;color:#16143A;font-family:"Alexandria",sans-serif;font-size:16px}
.pi-t{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14px}
.pi-t th{background:#16143A;color:#FFFFFF;font-family:"Alexandria",sans-serif;font-weight:600;font-size:12px;padding:10px;text-align:right}

/* ---------- order logic ---------- */
function cartCount(){return Object.keys(cart).length}
function updateBadge(){const n=cartCount(),c=$('cnt');if(!c)return;c.hidden=!n;c.textContent=n;}
const itemName=(id,fold)=>{const p=prod(id);return p.name+(p.fold?' ('+foldL(fold)+')':'');};
function renderCart(){
  const list=$('cartList'); if(!list)return;
  const ids=Object.keys(cart);
  list.innerHTML=ids.length?ids.map(id=>{const p=prod(id),c=cart[id];return `<div class="ci"><img src="img/${p.img}.jpg" alt=""><div><h4>${p.name}${p.fold?' · '+foldL(c.fold):''}</h4><small class="num">${fmt(p.price)} ${tr('لكل 1000','per 1,000')}</small></div>
    <div class="r"><div class="stepper"><button type="button" data-cq="1" data-id="${id}" aria-label="${tr('زيادة','Increase')}">+</button><output class="num">${(c.q*1000).toLocaleString('en-US')}</output><button type="button" data-cq="-1" data-id="${id}" aria-label="${tr('إنقاص','Decrease')}">−</button></div><button type="button" class="rm" data-rm="${id}">${tr('إزالة','Remove')}</button></div></div>`}).join('')
    :`<div class="empty">${tr('طلبك فارغ حالياً. أضف منتجاً من الأسفل أو','Your order is empty. Add a product below or')} <a href="#products">${tr('تصفّح المنتجات','browse products')}</a>.</div>`;
  $('addMore').innerHTML=P.filter(p=>!cart[p.id]).map(b=>{const p=prod(b.id);return `<button type="button" data-quick="${p.id}"><img src="img/${p.img}.jpg" alt="">${p.name} · ${p.price}</button>`}).join('')||`<span style="color:var(--muted);font-size:.85rem">${tr('أضفت جميع المنتجات','All products added')}</span>`;
  const sub=ids.reduce((a,id)=>a+byId[id].price*cart[id].q,0),fee=ids.length&&ship==='delivery'?DEL:0,t=sub+fee;
  $('total').textContent=fmt(t);
  const n=ids.length;
  $('count').textContent=n?`${LANG==='en'?n+(n>1?' products':' product'):(n>1?n+' منتجات':'منتج واحد')} · ${fee?tr('شامل التوصيل 25 درهم','incl. AED 25 delivery'):tr('استلام من عجمان','Pickup in Ajman')}`:tr('لا توجد منتجات في الطلب','No products in your order');
  $('tabbyNote').textContent=t?`4 × ${(t/4).toLocaleString('en-US',{maximumFractionDigits:2})} ${tr('درهم دون فوائد','AED, interest-free')}`:tr('دون فوائد','Interest-free');
  updateBadge(); return t;
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1900);}
function addFromDraft(id){const d=drafts[id]||{q:1,fold:'tri'};cart[id]={q:d.q,fold:d.fold};updateBadge();}

let padDirty=false;
function setupPad(){
  const cv=$('pad'),ctx=cv.getContext('2d'),r=cv.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#16143A';
  padDirty=false;$('padHint').hidden=false;
  if(cv._bound)return;cv._bound=true;
  let drawing=false,last=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);const c=cv.getContext('2d');c.beginPath();c.arc(last.x,last.y,1.2,0,Math.PI*2);c.fillStyle='#16143A';c.fill();padDirty=true;$('padHint').hidden=true;});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pt(e),c=cv.getContext('2d');c.beginPath();c.moveTo(last.x,last.y);const mx=(last.x+p.x)/2,my=(last.y+p.y)/2;c.quadraticCurveTo(last.x,last.y,mx,my);c.lineTo(p.x,p.y);c.stroke();last=p;});
  const end=()=>{drawing=false;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
}
function padImage(){
  // crop to the ink and scale down so it stays light in the order record
  const cv=$('pad'),c=cv.getContext('2d'),{width:w,height:h}=cv,data=c.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){if(data[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<=x0)return '';const pad=10;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w,x1+pad);y1=Math.min(h,y1+pad);
  const sw=x1-x0,sh=y1-y0,sc=Math.min(1,360/sw,140/sh),o=document.createElement('canvas');o.width=Math.round(sw*sc);o.height=Math.round(sh*sc);
  o.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height);return o.toDataURL('image/png');
}

}

  if(EN)txt('Thank you for your business · Infinity Graphic · '+PHONE,W/2,H-34,{sz:12,col:MUT,al:'center'});
  else{txt('شكراً لثقتكم · Infinity Graphic · واتساب وهاتف',W/2+70,H-34,{sz:12,col:MUT,al:'center'});txt(PHONE,W/2-150,H-34,{sz:12,col:MUT,ltr:true,al:'center'});}
  return cv;
}
async function buildPdf(d){
  if(!window.jspdf)throw new Error('lib');
  try{await document.fonts.ready;await Promise.all(['400 15px Tajawal','700 15px Tajawal','700 20px Alexandria','800 36px Alexandria'].map(f=>document.fonts.load(f)));}catch(_){}
  const cv=await drawInvoice(d);
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  pdf.addImage(cv.toDataURL('image/jpeg',.94),'JPEG',0,0,210,297);
  pdf.setProperties({title:(d.lang==='en'?'Invoice ':'فاتورة ')+d.no,author:'Infinity Graphic'});
  return new File([pdf.output('blob')],`${d.lang==='en'?'Invoice':'فاتورة'}-${String(d.no).replace(/[^\w\u0600-\u06FF-]/g,'')}.pdf`,{type:'application/pdf'});
}
function preparePdf(){
  if(!inv)return Promise.reject(new Error('no invoice'));
  if(pdfJob)return pdfJob;
  const d=inv;
  pdfJob=buildPdf(d).then(f=>(pdfFile=f));
  pdfJob.catch(()=>{pdfJob=null;});
  return pdfJob;
}
let dlNS;
async function downloadsNS(){
  if(dlNS!==undefined)return dlNS;
  try{dlNS=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(_){dlNS=null;}
  return dlNS;
}
async function saveFile(f){
  const dl=await downloadsNS();
  if(dl){await dl.save({filename:f.name,data:f});return;}
  const url=URL.createObjectURL(f),a=document.createElement('a');
  a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const failMsg=()=>tr('تعذّر تجهيز ملف PDF على هذا المتصفح. اضغط الزر الأخضر لإرسال الفاتورة كاملة عبر واتساب.','Couldn’t create the PDF in this browser. Tap the green button to send the full invoice on WhatsApp.');
const saveErr=e=>e&&e.code==='declined'?'':failMsg();
async function sharePdf(){
  if(inv&&!inv.signature){openSign();return;}
  let f;
  try{pdfStatus(tr('جارٍ تجهيز الفاتورة…','Preparing your invoice…'));f=pdfFile||await preparePdf();}
  catch(e){pdfStatus(failMsg());return;}
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:tr('فاتورة ','Invoice ')+inv.no,text:msg});
      pdfStatus(tr('تم ✓ عند المشاركة عبر واتساب اختر الرقم 050 689 2431، أو استخدم الزر الأخضر لفتح محادثتنا مباشرة.','Done ✓ When sharing via WhatsApp, choose 050 689 2431, or use the green button to open our chat directly.'));return;
    }
  }catch(e){if(e&&e.name==='AbortError'){pdfStatus('');return;}}
  try{await saveFile(f);pdfStatus(tr('تم تحميل الفاتورة PDF ✓ اضغط الزر الأخضر لفتح محادثتنا على واتساب، ثم أرفق الملف عبر 📎.','Invoice PDF downloaded ✓ Tap the green button to open our WhatsApp chat, then attach the file with 📎.'));}
  catch(e){pdfStatus(saveErr(e));}
}
async function downloadPdf(){
  if(inv&&!inv.signature){openSign();return;}
  let f;
  try{pdfStatus(tr('جارٍ تجهيز الفاتورة…','Preparing your invoice…'));f=pdfFile||await preparePdf();}
  catch(e){pdfStatus(failMsg());return;}
  try{await saveFile(f);pdfStatus(tr('تم تحميل الفاتورة PDF ✓','Invoice PDF downloaded ✓'));}catch(e){pdfStatus(saveErr(e));}
}
// keyboard open → move the sticky bar out of the way and keep the field visible
document.addEventListener('focusin',e=>{
  if(e.target.matches&&e.target.matches('#order input[type=text],#order input[type=tel],#order textarea,#order select')){
    document.body.classList.add('typing');
    setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'});}catch(_){}},300);
  }
});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('#order input,#order textarea,#order select')))document.body.classList.remove('typing');},150);});
// warm the namespace early so the click stays fast
downloadsNS();

/* ---------- events ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');
  if(h.startsWith('https://wa.me'))track(a.id==='waBtn'?'whatsapp_invoice':'whatsapp_click',{from:location.hash||'#home'});
  else if(h.startsWith('tel:'))track('call_click',{from:location.hash||'#home'});},true);
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;
  if(t.hasAttribute('data-lang')){setLang(LANG==='en'?'ar':'en');return;}
  if(t.dataset.tab){tab=t.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===t));$('grid').innerHTML=P.filter(p=>tab==='all'||p.g===tab).map(prodCard).join('');observe();return;}
  if(t.dataset.pq){const id=location.hash.slice(3),d=drafts[id];d.q=Math.max(1,Math.min(20,d.q+ +t.dataset.pq));$('pq').textContent=(d.q*1000).toLocaleString('en-US');$('ptot').textContent=fmt(byId[id].price*d.q);return;}
  if(t.dataset.fold){const id=location.hash.slice(3);drafts[id].fold=t.dataset.fold;document.querySelectorAll('[data-fold]').forEach(x=>x.setAttribute('aria-pressed',x===t));return;}
  if(t.dataset.order){track('buy_now',{product:t.dataset.order});addFromDraft(t.dataset.order);location.hash='order';return;}
  if(t.dataset.add){track('add_to_cart',{product:t.dataset.add});addFromDraft(t.dataset.add);toast(tr('تمت الإضافة إلى طلبك ✓','Added to your order ✓'));return;}
  if(t.dataset.cq){const c=cart[t.dataset.id];c.q=Math.max(1,Math.min(20,c.q+ +t.dataset.cq));renderCart();return;}
  if(t.dataset.rm){delete cart[t.dataset.rm];renderCart();return;}
  if(t.dataset.quick){cart[t.dataset.quick]={q:1,fold:'tri'};renderCart();return;}
});

let io;
function observe(){
  try{io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));}catch(e){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));}
}

/* ---------- router ---------- */
function route(){
  const h=(location.hash||'#home').slice(1);
  let view='home',html;
  if(h==='how'){view='how';html=vHow();}
  else if(h==='services'){view='services';html=vServices();}
  else if(h==='admin'){view='admin';html=vAdmin();}
  else if(h==='order'){view='order';html=vOrder();}
  else if(h.startsWith('cat-')&&catById[h.slice(4)]){view='products';html=vCat(catById[h.slice(4)]);}
  else if(h.startsWith('p-')&&byId[h.slice(2)]){view='products';html=vProduct(byId[h.slice(2)]);}
  else html=vHome();
  // the orders dashboard is internal and always in Arabic
  app.dir=view==='admin'||LANG==='ar'?'rtl':'ltr';app.lang=view==='admin'?'ar':LANG;
  app.innerHTML=`<div class="view">${html}</div>`;
  document.body.classList.toggle('on-order',view==='order');
  document.body.classList.toggle('on-admin',view==='admin');
  document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',(a.dataset.nav===view||(h==='products'&&a.dataset.nav==='products')||(view==='home'&&h!=='products'&&a.dataset.nav==='home'))?'page':'false'));
  if(view==='admin'){try{localStorage.setItem('ig_notrack','1');}catch(_){}window.IG_NOTRACK=true;}
  else{try{window.clarity&&clarity('set','page',h);}catch(_){}}
  if(view==='order')bindOrder();
  if(view==='admin')bootDash();
  updateBadge(); observe();
  if(h==='products'){const g=$('products');g&&requestAnimationFrame(()=>g.scrollIntoView());}
  else window.scrollTo(0,0);
}
addEventListener('hashchange',route);
renderShell();
route();
